/* ══ 开机层 ══ */
#boot{position:fixed;inset:0;z-index:1000;background:#0E2350;}
#boot iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
#bootEnter{position:absolute;left:50%;top:64%;transform:translateX(-50%);z-index:1001;
  display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;}
#bootEnter .pwr{width:64px;height:64px;border-radius:50%;border:2px solid rgba(242,240,232,.75);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:#F2F0E8;
  animation:breathe 2.2s ease-in-out infinite;background:rgba(14,35,80,.35);backdrop-filter:blur(4px);}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(242,240,232,.35);}50%{box-shadow:0 0 26px 6px rgba(242,240,232,.5);}}
/* 封面 BGM 的唱针在 p01-cover.html 内（配合原唱片） */
.ttCap{margin-top:6px;text-align:center;font-size:8.5px;letter-spacing:.2em;color:rgba(242,240,232,.55);white-space:nowrap;}
#bootEnter .hint{font-size:14px;letter-spacing:.32em;color:rgba(242,240,232,.85);}
#bootEnter .hint2{font-size:11.5px;letter-spacing:.18em;color:rgba(242,240,232,.5);}

/* ══ 桌面 ══ */
#desktop{position:fixed;inset:0;z-index:1;display:none;}
#wallpaper{position:absolute;inset:0;overflow:hidden;background:#0d0e11;}
.wp{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;background-size:cover;background-position:center;will-change:opacity;}
.wp.show{opacity:1;}
.wp iframe{position:absolute;left:50%;top:50%;border:none;width:1600px;height:900px;pointer-events:none;}


/* ═══ ryOS Dock 鱼眼放大（2.3x / 140px / 弹簧） ═══ */
#dock .di{transition:none;will-change:width,height,transform;transform-origin:bottom center;}
#dock .di img{transition:transform .1s ease-out;}
#dock .di .tip{position:absolute;bottom:100%;margin-bottom:10px;left:50%;transform:translateX(-50%);
 background:rgba(30,30,32,.92);color:rgba(255,255,255,.92);font-size:12.5px;font-weight:500;
 padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;z-index:600;opacity:0;
 transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.35);}
#dock .di .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
 width:10px;height:5px;background:rgba(30,30,32,.92);clip-path:polygon(50% 100%,0 0,100% 0);}
#dock .di:hover .tip{opacity:1;}

/* 壁纸选择器 */
#wpPick{position:absolute;left:6px;top:27px;z-index:900;width:288px;display:none;
 background:rgba(245,244,238,.97);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.18);
 border-radius:9px;box-shadow:0 16px 44px rgba(0,0,0,.38);padding:10px;font-size:12.5px;color:#222;}
#wpPick.open{display:block;}
#wpPick .hd{font-weight:700;letter-spacing:.04em;padding:2px 4px 8px;color:#333;}
#wpPick .slide{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;cursor:pointer;margin-bottom:6px;
 border:1px solid rgba(0,0,0,.12);background:#fff;}
#wpPick .slide:hover{background:#2765CA;color:#fff;border-color:#2765CA;}
#wpPick .slide.on{background:#2765CA;color:#fff;border-color:#2765CA;}
#wpPick .gd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
#wpPick .th{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;cursor:pointer;
 background-size:cover;background-position:center;border:2px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.2);}
#wpPick .th.sel{border-color:#2765CA;}
#wpPick .th span{position:absolute;left:0;right:0;bottom:0;font-size:9px;line-height:1.3;padding:3px 4px;
 background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;letter-spacing:.02em;}
#menubar{position:absolute;left:0;right:0;top:0;height:25px;z-index:500;display:flex;align-items:center;
  padding:0 14px;gap:20px;font-size:14px;color:#000;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 1.5px,rgba(255,255,255,.55) 1.5px,rgba(255,255,255,.55) 4px),linear-gradient(to bottom,#f8f8f8,#d4d4d4);border-bottom:0.5px solid rgba(0,0,0,.44);}
#menubar .apple{display:inline-flex;align-items:center;cursor:pointer;padding:0 3px;}
#menubar .apple svg{width:15px;height:18px;fill:#1c1c1c;}
#menubar .apple:hover{background:rgba(39,101,202,.88);border-radius:3px;}
#menubar .apple:hover svg{fill:#fff;}
#appleMenu{position:absolute;left:4px;top:26px;z-index:950;width:214px;display:none;
 background:rgba(245,244,238,.98);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.16);
 border-radius:8px;box-shadow:0 16px 44px rgba(0,0,0,.4);padding:5px;font-size:13px;color:#1c1c1c;}
#appleMenu.open{display:block;}
#appleMenu .ai{padding:7px 12px;border-radius:5px;cursor:pointer;}
#appleMenu .ai:hover{background:#2765CA;color:#fff;}
#appleMenu .sep{height:1px;background:rgba(0,0,0,.14);margin:4px 6px;}
#shutdownOv{position:fixed;inset:0;z-index:3000;background:#0E2350;opacity:0;pointer-events:none;
 transition:opacity 1s ease;display:none;overflow:hidden;}
#shutdownOv iframe{position:absolute;left:50%;top:50%;width:1600px;height:900px;border:none;pointer-events:none;}
#shutdownOv.on{opacity:1;pointer-events:auto;}
#menubar .app{font-weight:700;}
#menubar .m{padding:1px 4px;border-radius:3px;cursor:default;font-size:13.5px;}
#menubar .m:hover{background:rgba(39,101,202,.88);color:#fff;}
#menubar .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:rgba(0,0,0,.72);}

#dicons{position:absolute;right:20px;top:52px;display:flex;flex-direction:column;gap:22px;align-items:flex-end;z-index:10;}
#resumeDesktop{position:absolute;right:150px;top:52px;z-index:10;} 
#resumeDesktop .dicon{width:96px;}
.dicon{display:flex;flex-direction:column;align-items:center;width:96px;cursor:pointer;}
.dicon img{width:52px;height:52px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:transform .1s;}
.dicon:hover img{transform:scale(1.06);}
.dicon span{margin-top:4px;font-size:12px;color:#fff;text-align:center;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.9);}

/* ══ 窗口 ══ */
.win{position:absolute;border-radius:7.2px;overflow:hidden;
 background:repeating-linear-gradient(0deg,transparent 0px,transparent 1.5px,rgba(255,255,255,.85) 1.5px,rgba(255,255,255,.85) 4px),
  linear-gradient(to bottom,#ececec 0%,#ececec 100%);
  border:0.5px solid rgba(0,0,0,.4);
  box-shadow:0 3px 10px rgba(0,0,0,.3), 0 18px 50px rgba(0,0,0,.28);
  display:flex;flex-direction:column;z-index:100;}
.win.max{border-radius:0;}
.wbar{height:22px;flex:none;display:flex;align-items:center;position:relative;cursor:move;
  background:linear-gradient(to bottom,rgba(255,255,255,.3) 0%,rgba(219,219,219,.6) 70%,rgba(206,206,206,.7) 100%);
  border-bottom:1px solid rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(0,0,0,.05);}
.wbar .tl{position:absolute;left:8px;display:flex;gap:8px;}
.tlb{width:12px;height:12px;border-radius:50%;border:0.5px solid rgba(0,0,0,.2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(0,0,0,.45);}
.tlb.c{background:radial-gradient(circle at 35% 30%, #ff8a80, #ff5f57 60%, #d63931);}
.tlb.m{background:radial-gradient(circle at 35% 30%, #ffe08a, #febc2e 60%, #d89e24);}
.tlb.z{background:radial-gradient(circle at 35% 30%, #8fe89a, #28c840 60%, #1dad2b);}
.wbar .t{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;pointer-events:none;}
.wbody{flex:1;overflow:hidden;position:relative;background:#fff;}
.wbody iframe{scrolling:no;pointer-events:auto;position:absolute;left:0;top:0;border:none;transform-origin:top left;}
.page-loadbar{position:absolute;left:0;right:0;top:0;height:2px;z-index:30;overflow:hidden;background:rgba(28,88,190,.08);}
.page-loadbar::after{content:"";display:block;width:34%;height:100%;background:linear-gradient(90deg,transparent,#4d8cff,transparent);animation:pageLoad 1s ease-in-out infinite;}
@keyframes pageLoad{from{transform:translateX(-110%)}to{transform:translateX(360%)}}

/* Finder 列表 */
.flist{padding:8px 10px;overflow-y:auto;height:100%;background:#fff;-webkit-user-select:none;}
.frow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:14px;
  padding:8px 10px;border-radius:6px;cursor:pointer;}
.frow:hover{background:rgba(39,101,202,.12);}
.frow img{width:96px;aspect-ratio:16/9;object-fit:cover;border:0.5px solid rgba(0,0,0,.2);border-radius:3px;}
.frow .nm{font-size:13px;font-weight:600;}
.frow .ds{font-size:11.5px;color:#4b4b4b;margin-top:3px;}
.frow .pg{font-size:12px;color:#2765ca;font-weight:600;}
.frow.external{margin-top:7px;border:1px solid rgba(35,89,209,.28);background:rgba(35,89,209,.07);}
.frow.external .nm{color:#2359D1;font-weight:800;}
.frow.external .pg{padding:4px 9px;border-radius:999px;background:#2359D1;color:#fff;font-weight:700;}

/* ══ Dock ══ */
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:500;
  display:inline-flex;align-items:flex-end;max-width:92vw;transition:none;gap:8px;padding:7px 10px;border-radius:18px;
  background:rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:0.5px solid rgba(255,255,255,.6);box-shadow:0 3px 10px rgba(0,0,0,.25);}
#dapps{display:flex;gap:8px;align-items:flex-end;}
.di{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;height:52px;width:52px;overflow:visible;}
.di img{width:46px;height:46px;flex-shrink:0;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);transform-origin:bottom center;}
.di:hover img{filter:brightness(1.06);}
.di .lbl{position:absolute;bottom:56px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;
  padding:3px 8px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;}
.di:hover .lbl{opacity:1;}
.di .dot{position:absolute;bottom:-4px;width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.6);display:none;}
.di.running .dot{display:block;}
#dsep{width:1px;height:38px;background:rgba(0,0,0,.25);margin:0 3px;align-self:center;}
#minArea{display:flex;gap:8px;}


/* ═══ 系统菜单（ryOS 菜单风格） ═══ */
.sysmenu{position:absolute;top:26px;z-index:950;min-width:230px;display:none;
 background:rgba(250,250,250,.97);backdrop-filter:blur(16px);border:0.5px solid rgba(0,0,0,.22);
 border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:5px;font-size:13.5px;color:#1c1c1e;}
.sysmenu.open{display:block;}
.sysmenu .smi{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:5px;cursor:pointer;}
.sysmenu .smi:hover{background:#3a73d6;color:#fff;}
.sysmenu .smi img{width:20px;height:20px;mix-blend-mode:multiply;}
.sysmenu .smi .sc{margin-left:auto;font-size:11.5px;color:rgba(0,0,0,.4);}
.sysmenu .smi:hover .sc{color:rgba(255,255,255,.7);}
.sysmenu .sep{height:1px;background:rgba(0,0,0,.12);margin:4px 8px;}

/* ═══ iPod 桌面设备（无窗口） ═══ */
#ipodDevice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;
 pointer-events:none;transition:transform .45s cubic-bezier(.22,1.1,.36,1),opacity .3s;z-index:400;
 width:min(36vh,20vw);height:min(72vh,40vw);border-radius:2.4vh;z-index:100;}
#ipodDevice.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
#ipodDevice iframe{width:100%;height:100%;border:none;border-radius:inherit;background:transparent;}
/* iPod 上方迷你控制灯：红=关闭停播，黄=最小化 */
#ipodLights{position:absolute;top:-30px;left:10px;z-index:402;display:flex;gap:6px;padding:4px 8px;
 background:rgba(30,30,32,.55);backdrop-filter:blur(8px);border-radius:999px;opacity:.35;transition:opacity .2s;}
#ipodDevice:hover #ipodLights{opacity:1;}
/* 拖拽呼吸：按下微缩 */
#ipodDevice.dragging{filter:brightness(.97);}
#ipodDevice.dragging iframe{transform:scale(.985);transition:transform .18s cubic-bezier(.3,.7,.4,1);}
#ipodDevice iframe{transition:transform .25s cubic-bezier(.3,.7,.4,1);}
#ipodLights .lt{width:11px;height:11px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.3);}
#ipodLights .lt-red{background:#ff5f57;}
#ipodLights .lt-yel{background:#febc2e;}

/* ═══ iPod 拖动 + 红绿灯 ═══ */
function bringFrontIpod(d){
  // 跟窗口体系同步：提升 zTop 并应用到 iPod（低于当前活动窗口一个层级，点窗口时窗口在上）
  zTop+=2;
  d.style.zIndex=zTop;
}
function closeIpod(stopMusic){
  const d=document.getElementById('ipodDevice');
  d.classList.remove('open');
  d.style.left='';d.style.right='';d.style.top='';d.style.bottom='';
  d.style.transform='';
  sfx('WindowClose');
  if(stopMusic){
    // 红灯：停止播放
    try{
      const ifr=d.querySelector('iframe');
      ifr.contentWindow.postMessage({type:'ipod-stop'},'*');
    }catch(err){}
  }
}
(function ipodDrag(){
  const d=document.getElementById('ipodDevice');
  if(!d)return;
  let startLeft=0,startTop=0,dragging=false;
  window.addEventListener('message',e=>{
    const t=e.data&&e.data.type;
    if(t==='ipod-drag-start'){
      dragging=true;
      bringFrontIpod(d);
      // 实体化：CSS 居中转真实像素，去 transform，避免跳变
      const r=d.getBoundingClientRect();
      d.style.transition='none';
      d.style.transform='none';
      d.style.left=r.left+'px';d.style.top=r.top+'px';
      startLeft=r.left;startTop=r.top;
      d.classList.add('dragging');
    }
    else if(t==='ipod-drag-to'&&dragging){
      const x=Math.max(-40,Math.min(innerWidth-60,startLeft+e.data.dsx));
      const y=Math.max(25,Math.min(innerHeight-60,startTop+e.data.dsy));
      d.style.left=x+'px';d.style.top=y+'px';
    }
    else if(t==='ipod-drag-end'){
      dragging=false;
      d.classList.remove('dragging');
    }
  });
})();

/* ═══ ryOS Dock 鱼眼（真实尺寸变化，容器自适应伸缩） ═══ */
(function dockMagnify(){
  const MAX_SCALE=2.3, MAG_DIST=140;
  const dock=document.getElementById('dock');
  if(!dock)return;
  let raf=null,mouseX=Infinity;
  const items=()=>[...dock.querySelectorAll('.di')];
  // tooltip
  items().forEach(it=>{
    if(!it.querySelector('.tip')){
      const lbl=it.querySelector('.lbl');
      const tip=document.createElement('span');tip.className='tip';
      tip.textContent=lbl?lbl.textContent.split(' · ')[0]:'';
      it.appendChild(tip);
    }
  });
  // 初始基准尺寸（从当前 img 自然尺寸读取）
  const base=()=>items().map(()=>46); // 基准固定 46px（CSS 定义）
  let baseSizes=null;
  function ensureBase(){if(!baseSizes)baseSizes=base();}
  dock.addEventListener('mouseenter',()=>{ensureBase();});
  dock.addEventListener('mousemove',e=>{
    mouseX=e.clientX;
    if(!raf)raf=requestAnimationFrame(apply);
  });
  dock.addEventListener('mouseleave',()=>{mouseX=Infinity;if(!raf)raf=requestAnimationFrame(apply);});
  function apply(){
    raf=null;
    const dis=items();ensureBase();
    dis.forEach((it,i)=>{
      const b=baseSizes[i]||46;
      const img=it.querySelector('img');
      const w=parseFloat(it.style.width)||52; // .di 固定高 52，宽度取当前（含放大后）
      const r=it.getBoundingClientRect();
      if(!r.width)return;
      const center=r.left+r.width/2;
      const dist=Number.isFinite(mouseX)?mouseX-center:Infinity;
      let size=b;
      if(Math.abs(dist)<MAG_DIST){
        const t=1-Math.abs(dist)/MAG_DIST;
        size=b+t*(b*(MAX_SCALE-1));
      }
      // 高度不变：容器只变宽（相邻推开），图标用 scale 向上放大
      const sc=size/b;
      img.style.transform=`translateX(-50%) scale(${sc})`;
      it.style.width=size+'px';
      img.style.transition='transform .12s ease-out';
      it.style.transition='width .12s ease-out';
      it.style.zIndex=sc>1.05?550:'';
    });
  }
  // 离开 dock 时复位
  dock.addEventListener('mouseleave',()=>{
    items().forEach(it=>{
      const img=it.querySelector('img');
      img.style.transform='translateX(-50%)';
      it.style.width='';
    });
  });
})();

function makeWin(id,title,w,h,x,y){

  w$.style.cssText=`width:${w}px;height:${h}px;left:${cx}px;top:${cy}px;z-index:${++zTop}`;
  w$.innerHTML=`<div class="wbar"><div class="tl">
      <div class="tlb c" title="关闭"></div><div class="tlb m" title="最小化"></div><div class="tlb z" title="缩放"></div>
    </div><span class="t">${title}</span></div><div class="wbody"></div>`;
  $('#wins').appendChild(w$);
  bringFront(w$);
  w$.addEventListener('mousedown',()=>bringFront(w$));
  // 拖拽
  const bar=w$.querySelector('.wbar');
  bar.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('tlb'))return;
    const sx=e.clientX-w$.offsetLeft, sy=e.clientY-w$.offsetTop;
    function mv(ev){w$.style.left=(ev.clientX-sx)+'px';w$.style.top=Math.max(25,ev.clientY-sy)+'px';}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
  // 按钮
  w$.querySelector('.tlb.c').onclick=ev=>{ev.stopPropagation();sfx('WindowClose');w$.remove();delete openWins[id];markRunning(id,false);};
  w$.querySelector('.tlb.m').onclick=ev=>{ev.stopPropagation();minimize(w$,id,title);};
  w$.querySelector('.tlb.z').onclick=ev=>{ev.stopPropagation();toggleMax(w$);};
  openWins[id]=w$; markRunning(id,true);
  sfx('WindowOpen');
  return w$;
}
function toggleMax(w$){
  if(w$.classList.contains('max')){Object.assign(w$.style,w$._prev);w$.classList.remove('max');sfx('WindowExpand');}
  else{w$._prev={left:w$.style.left,top:w$.style.top,width:w$.style.width,height:w$.style.height};
    Object.assign(w$.style,{left:'0px',top:'25px',width:'100vw',height:'calc(100vh - 25px)'});

/* ── 页面资源预热：HTML + 页面图片异步缓存/解码 ── */
const __warmPages=new Map();
function warmPage(slug,priority='low'){
  if(!slug)return Promise.resolve();
  if(__warmPages.has(slug))return __warmPages.get(slug);
  const url=new URL('pages/'+slug+'.html',location.href);
  const job=fetch(url,{cache:'force-cache'}).then(r=>r.text()).then(html=>{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const urls=new Set();
    doc.querySelectorAll('img[src]').forEach(el=>urls.add(el.getAttribute('src')));
    for(const m of html.matchAll(/url\(["']?([^"')]+)["']?\)/g))urls.add(m[1]);
    urls.forEach(src=>{
      if(!src||src.startsWith('data:')||!(/\.(?:webp|png|jpe?g|gif)(?:\?|$)/i.test(src)))return;
      const img=new Image();
      img.decoding='async';
      try{img.fetchPriority=priority;}catch(e){}
      img.src=new URL(src,url).href;
      img.onload=()=>{try{img.decode&&img.decode();}catch(e){}};
    });
  }).catch(()=>{});
  __warmPages.set(slug,job);
  return job;
}
function warmCase(id){
  const c=CASES.find(x=>x.id===id);if(!c||!c.pages.length)return;
  warmPage(c.pages[0][0],'high');
  const rest=()=>c.pages.slice(1).forEach((p,i)=>setTimeout(()=>warmPage(p[0],'low'),i*120));
  if('requestIdleCallback' in window)requestIdleCallback(rest,{timeout:900});else setTimeout(rest,260);
}

    </div>`;
  }).join('');
  body.appendChild(fl);
}
let pgX=420,pgY=110;
const __swipe={lastWheelAt:0,canFire:true,idleTimer:null};
function __swipeGate(){
  clearTimeout(__swipe.idleTimer);
  __swipe.idleTimer=setTimeout(()=>{__swipe.canFire=true;},300);
  if(!__swipe.canFire)return false;
  __swipe.canFire=false;
  return true;
}
function openPage(id,title,file,caseId,pageIdx,opts){
  if(openWins[id]){const w=openWins[id]; w.style.display='flex'; bringFront(w); return;}
  if(caseId){
    // 打开案例页时，关闭其他干扰窗口（关于我等），保证翻页目标明确
    Object.keys(openWins).forEach(k=>{
      if(k!==id&&(k==='about'||k==='p25'||k==='index')){openWins[k].remove();delete openWins[k];}
    });
  }
  // 所有内容页都是 1600×900（16:9）：窗口高度严格等于缩放后画布高度 + 25px 标题栏，杜绝底部空白
  const titleH=25;
  const preferredW=id==='about'?1150:(opts&&opts.w||1200);
  const sideGap=id==='about'?140:100;
  const verticalGap=id==='about'?110:70;
  const maxBodyH=Math.max(360,innerHeight-verticalGap-titleH);
  let ww=Math.min(preferredW,innerWidth-sideGap,maxBodyH*16/9);
  let hh=ww*9/16+titleH;
  let xx=(innerWidth-ww)/2;
  let yy=Math.max(34,(innerHeight-hh)/2);
  const w$=makeWin(id,title,ww,hh,xx,yy);
  const body=w$.querySelector('.wbody');
  showPageLoader(body);
  warmPage(file,'high');
  const f=document.createElement('iframe');
  f.style.opacity='0';
  f.src='pages/'+file+'.html';
  f.onload=()=>{fitIframe(w$,f);f.style.opacity='1';hidePageLoader(body);
    // 转发 iframe 内键盘事件到父页，保证翻页灵敏
    try{
      f.contentDocument.addEventListener('keydown',e=>{
        if(e.key==='ArrowLeft')e.preventDefault(),w$._nav&&w$._nav(-1);
        if(e.key==='ArrowRight')e.preventDefault(),w$._nav&&w$._nav(1);
      });
      f.contentDocument.addEventListener('wheel',e=>{
        if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>8){
          e.preventDefault&&e.preventDefault();
          if(__swipeGate())w$._nav&&w$._nav(e.deltaX<0?-1:1);
        }
      },{passive:false,capture:true});
    }catch(err){}
  };
  body.appendChild(f);
  // iframe 元素上的 wheel（触控板横滑在 iframe 上时也捕获）
  f.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>8){
      e.preventDefault&&e.preventDefault();
      if(__swipeGate())w$._nav&&w$._nav(e.deltaX<0?-1:1);
    }
  },{passive:false,capture:true});
  // 案例页翻页（左右滑动/方向键）
  if(caseId){
    const c=CASES.find(x=>x.id===caseId);
    const pages=c?c.pages:[];
    if(pages.length>1){
      let cur=pageIdx;
      const tspan=w$.querySelector('.wbar .t');
      w$._nav=nav;
      function nav(d){
        let n=cur;
        do{n+=d;}while(pages[n]&&pages[n][3]&&n>=0&&n<pages.length);
        if(n<0||n>=pages.length)return;
        cur=n;
        f.style.opacity='0';
        showPageLoader(body);
        warmPage(pages[n][0],'high');
        setTimeout(()=>{
          f.src='pages/'+pages[n][0]+'.html';
          tspan.textContent=pages[n][1]+' · '+pages[n][2];
          f.onload=()=>{
            fitIframe(w$,f);
            f.style.opacity='1';
            hidePageLoader(body);
            try{
              f.contentDocument.addEventListener('keydown',e=>{
                if(e.key==='ArrowLeft')e.preventDefault(),w$._nav&&w$._nav(-1);
                if(e.key==='ArrowRight')e.preventDefault(),w$._nav&&w$._nav(1);
              });
              f.contentDocument.addEventListener('wheel',e=>{
        if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>8){
          e.preventDefault&&e.preventDefault();
          if(__swipeGate())w$._nav&&w$._nav(e.deltaX<0?-1:1);
        }
      },{passive:false,capture:true});
            }catch(err){}
          };
        },130);
        sfx('Click');
      }
      // 键盘 + 触控板横滑：capture 阶段全局监听，仅当此窗口是最顶层时响应
      // 手势结束检测：翻页后需 300ms 无新 wheel 才允许翻下一页（一次手势只翻一页）
      function onSwipe(e){
        if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>8){
          e.preventDefault&&e.preventDefault(); // 拦截浏览器默认手势
          if(!__swipeGate())return;
          if(e.deltaX<0)nav(-1); else nav(1);
        }
      }
      function onKey(e){
        if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
        // 找当前最顶层窗口
        const wins=[...document.querySelectorAll('.win')];
        const top=wins.reduce((a,b)=>(+b.style.zIndex>+a.style.zIndex?b:a),wins[0]);
        if(top!==w$)return;
        if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
        if(e.key==='ArrowLeft')nav(-1);
        if(e.key==='ArrowRight')nav(1);
      }
      function onEvt(e){
        // 只处理最顶层窗口
        const wins=[...document.querySelectorAll('.win')];
        if(!wins.length)return;
        const top=wins.reduce((a,b)=>(+b.style.zIndex>+a.style.zIndex?b:a),wins[0]);
        if(top!==w$)return;
        if(e.type==='wheel')onSwipe(e); else onKey(e);
      }
      document.addEventListener('keydown',onEvt);
      document.addEventListener('wheel',onEvt,{passive:false,capture:true});
      // 点击窗口任意处即视为激活（视觉提示）
      w$.addEventListener('mousedown',()=>bringFront(w$));
            // 左右翻页区：点击或悬停均可翻页
      const mkNav=(dir)=>{
        const z=document.createElement('div');
        z.style.cssText='position:absolute;'+(dir<0?'left:0;':'right:0;')+'top:25px;bottom:0;width:56px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;background:linear-gradient('+(dir<0?'90deg':'270deg')+',rgba(0,0,0,.12),transparent);'
        z.innerHTML='<span style="font-size:26px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);">'+(dir<0?'‹':'›')+'</span>';
        z.onclick=ev=>{ev.stopPropagation();nav(dir);};
        z.onmouseenter=()=>z.style.opacity='1';
        z.onmouseleave=()=>z.style.opacity='0';
        w$.appendChild(z);
      };
      mkNav(-1);mkNav(1);
      f.style.transition='opacity .15s';
    }
  }
}

/* ── 封面 BGM：唱针在 p01-cover 内，postMessage 驱动 ── */
let bootBgmOn=false,bootBgmFade=null;
function toggleBootBgm(){
  const a=document.getElementById('bootBgm');
  if(bootBgmFade){clearInterval(bootBgmFade);bootBgmFade=null;}
  if(!bootBgmOn){
    a.volume=0;
    a.play().then(()=>{
      bootBgmOn=true;
      let v=0;bootBgmFade=setInterval(()=>{v+=.04;if(v>=.55){v=.55;a.volume=v;clearInterval(bootBgmFade);bootBgmFade=null;}else a.volume=v;},60);
    }).catch(()=>{});
  }else{
    let v=a.volume;bootBgmFade=setInterval(()=>{v-=.07;if(v<=0){a.pause();clearInterval(bootBgmFade);bootBgmFade=null;}else a.volume=v;},50);
    bootBgmOn=false;
  }
}
function stopBootBgm(){
  if(!bootBgmOn)return;
  const a=document.getElementById('bootBgm');
  if(bootBgmFade){clearInterval(bootBgmFade);bootBgmFade=null;}
  let v=a.volume;bootBgmFade=setInterval(()=>{v-=.08;if(v<=0){a.pause();clearInterval(bootBgmFade);bootBgmFade=null;}else a.volume=v;},40);
  bootBgmOn=false;
}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='boot-bgm-toggle')toggleBootBgm();});

let wpCur=0, wpActive='wpA', wpMode='slide', wpTimer=null;
function fillLayer(el,wp){
  if(wp.t==='html'){el.style.backgroundImage='none';el.innerHTML='<iframe src="'+wp.s+'"></iframe>';fitWall();}
  else{el.innerHTML='';el.style.backgroundImage='url("'+wp.s+'")';el.style.backgroundPosition=wp.pos||'center';}
}
function showWallpaper(idx){
  const cur=document.getElementById(wpActive);
  const nxt=document.getElementById(wpActive==='wpA'?'wpB':'wpA');
  fillLayer(nxt,WALLPAPERS[idx]);
  requestAnimationFrame(()=>{nxt.classList.add('show');cur.classList.remove('show');});
  wpActive=(wpActive==='wpA'?'wpB':'wpA'); wpCur=idx;
  document.querySelectorAll('#wpGrid .th').forEach((t,i)=>t.classList.toggle('sel',i===idx&&wpMode==='pin'));
}
function startSlideshow(){wpMode='slide'; clearInterval(wpTimer);

  document.querySelectorAll('#wpGrid .th').forEach(t=>t.classList.remove('sel'));}
function toggleSlideshow(){ if(wpMode==='slide'){wpMode='pin';clearInterval(wpTimer);document.getElementById('wpSlideBtn').classList.remove('on');document.querySelectorAll('#wpGrid .th').forEach((t,i)=>t.classList.toggle('sel',i===wpCur));} else {startSlideshow();} sfx('MenuItemClick'); }
