<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>P.05 业务与生态</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:#0f1012;color:var(--paper);
  font-family:"Noto Sans CJK SC",sans-serif;}
/* R15-1：左上 项目名 + 案例名 */
.brand{position:absolute;left:1.8%;top:3.4%;font-size:13px;color:rgba(242,240,232,.55);letter-spacing:.04em;}
.brand .case{display:block;margin-top:8px;font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:17px;color:var(--paper);}
/* 左 meta 栏（Role 列表）x≈1.8% y≈5.5% */
.meta{position:absolute;left:1.8%;top:12%;font-size:12.5px;line-height:2.1;color:rgba(242,240,232,.55);}
.meta .mk{color:rgba(242,240,232,.85);font-weight:600;}
/* 中央声明 + 段落 x≈9% y≈12% */
.state{position:absolute;left:9%;top:12%;width:36%;}
.state h1{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:30px;line-height:1.5;}
.state p{margin-top:20px;font-size:14.5px;line-height:1.9;color:rgba(242,240,232,.72);}
.state p b{color:var(--paper);}
.state .nums{margin-top:26px;font-size:13px;line-height:2.1;color:rgba(242,240,232,.6);}
.state .nums b{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:17px;color:var(--warm);margin-right:8px;}
.state .src{margin-top:18px;font-size:12px;color:rgba(242,240,232,.45);letter-spacing:.06em;}
/* 右侧图版区 x≈52% y≈12% → 右 6% */
.plate{position:absolute;left:52%;right:6%;top:12%;bottom:12%;overflow:hidden;}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;
  filter:grayscale(1) contrast(1.2) brightness(1.02);}
.plate .ink{position:absolute;inset:0;background:#1D4B96;mix-blend-mode:color;}
.plate .cap{position:absolute;left:0;bottom:-2px;transform:translateY(100%);padding-top:10px;
  font-size:12px;letter-spacing:.18em;color:rgba(242,240,232,.5);}
.foot{position:absolute;right:6%;bottom:3%;font-size:12px;letter-spacing:.18em;color:rgba(242,240,232,.4);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head><body>
<div class="brand">小红书 · Builder Hub<span class="case">开发者开放生态</span></div>
<div class="meta"><span class="mk">负责模块</span><br>业务 API<br>开发者基础设施<br>AI API<br><span class="mk">产品方向</span><br>让作品可发布、可体验、可持续创作</div>
<div class="state">
  <h1>三类开放能力，<br>连接创作者与社区</h1>
  <p><b>RedSkill</b> 让开发者发布可供 Agent 使用的 Skill；<b>小工具</b>让用户在小红书内直接体验开发者做出的应用。围绕创作与发布链路，我负责业务 API、开发者基础设施与 AI API 的产品落地。</p>
  <div class="nums">
    <div><b>千万级</b>累计使用用户</div>
    <div><b>5万+</b>创作者发布的小工具</div>
    <div><b>10万+</b>创作者发布的 Skill</div>
  </div>
  <div class="src">作品供给与用户体验持续增长</div>
</div>
<div class="plate">
  <img loading="lazy" decoding="async" src="../assets/gloves.jpg" alt="">
  <div class="ink"></div>
  <div class="cap">图版 01 ｜ GET HANDS DIRTY · 创作者精神</div>
</div>
<div class="foot">P.05</div>
</body></html>
