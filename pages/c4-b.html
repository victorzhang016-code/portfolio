<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Other Work · 建筑相册</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:#0b0c0e;color:var(--paper);
 font-family:"Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased;}
.stage{position:absolute;inset:0;padding:4.6% 5% 3.6%;
 background:radial-gradient(1000px 600px at 50% -10%, rgba(35,89,209,.14), transparent 60%), #0b0c0e;}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;}
.tl .k{font-size:12.5px;letter-spacing:.3em;color:var(--warm);}
.tl h1{margin-top:8px;font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:38px;line-height:1.1;}
.tr{text-align:right;font-size:12px;letter-spacing:.14em;color:rgba(242,240,232,.5);line-height:1.7;}
.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;height:650px;}
.frame{position:relative;border-radius:12px;overflow:hidden;background:#15171b;
 border:1px solid rgba(242,240,232,.1);box-shadow:0 18px 40px rgba(0,0,0,.4);}
.frame.big{grid-row:span 2;}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 background:repeating-linear-gradient(45deg,#141619 0 12px,#111316 12px 24px);color:rgba(242,240,232,.28);}
.ph svg{width:38px;height:38px;opacity:.5;}
.ph span{font-size:12px;letter-spacing:.14em;}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 14px;
 background:linear-gradient(transparent, rgba(0,0,0,.78));}
.cap .t{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:17px;color:#fff;}
.cap .m{margin-top:3px;font-size:11.5px;letter-spacing:.06em;color:rgba(242,240,232,.72);}
.badge{position:absolute;top:12px;left:12px;font-size:10.5px;letter-spacing:.14em;
 background:rgba(220,203,128,.92);color:#1a1a1a;padding:4px 10px;border-radius:999px;font-weight:700;}
.foot{position:absolute;left:5%;bottom:1.6%;font-size:11px;letter-spacing:.18em;color:rgba(242,240,232,.38);}
.foot2{position:absolute;right:5%;bottom:1.6%;font-size:11px;letter-spacing:.18em;color:rgba(242,240,232,.38);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head>
<body>

      <div class="cap"><div class="t">图纸 · 细节</div><div class="m">详细图纸备索 · 联系见末页</div></div>
    </div>
    <div class="frame">
      <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 16l5-4 4 3 3-2 6 5"/></svg><span>更多作品</span></div>
      <div class="cap"><div class="t">More · 持续补充</div><div class="m">把更多牛逼的建筑作品放进这面墙</div></div>
    </div>
  </div>

  <div class="foot">软件之前，我先做过空间</div>
