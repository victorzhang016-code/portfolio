<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>P.16 BUiLD 活动</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;font-family:"Noto Sans CJK SC",sans-serif;color:var(--ink);}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(.9);}
.card{position:absolute;left:7%;right:7%;top:12%;bottom:12%;background:#fff;display:grid;
  grid-template-columns:1.05fr 1.2fr .9fr;box-shadow:0 30px 80px rgba(0,0,0,.4);}
/* 左栏：品牌大图 + 元信息 */
.cl{padding:34px 30px 0;display:flex;flex-direction:column;}
.cl h2{font-family:"Noto Sans CJK SC",sans-serif;font-weight:900;font-size:52px;letter-spacing:-.02em;}
.cl .im{margin-top:16px;height:56%;overflow:hidden;}
.cl .im img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:grayscale(.15) contrast(1.05);}
.meta{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:16px 0 18px;font-size:11px;line-height:1.6;color:rgba(32,35,35,.7);}
.meta b{display:block;color:var(--ink);font-size:11.5px;margin-bottom:3px;}
/* 中栏：物料网格 */
.cc{border-left:1px solid rgba(32,35,35,.14);padding:34px 26px 0;display:flex;flex-direction:column;}
.cc h3{font-weight:900;font-size:30px;}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:16px;overflow:hidden;}
.g .gi{overflow:hidden;}
.g .gi img{width:100%;aspect-ratio:1/1.18;object-fit:cover;display:block;}
.g .gi span{display:block;font-size:10.5px;color:rgba(32,35,35,.6);margin-top:5px;}
/* 右栏：特写 + 宣言 */
.cr{border-left:1px solid rgba(32,35,35,.14);padding:34px 26px 0;display:flex;flex-direction:column;background:#f5f3ee;}
.cr h3{font-weight:900;font-size:30px;}
.cr .im{margin-top:16px;height:46%;overflow:hidden;}
.cr .im img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;}
.cr .say{margin-top:auto;padding:20px 0 24px;}
.cr .say .t{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:22px;line-height:1.55;}
.cr .say .d{margin-top:10px;font-size:12.5px;line-height:1.75;color:rgba(32,35,35,.65);}
.foot{position:absolute;right:7%;bottom:5%;font-size:12px;letter-spacing:.18em;color:rgba(242,240,232,.7);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head><body>
<img class="bgimg" src="../assets/bonjour-085.jpg" alt="">
<div class="card">
  <div class="cl">
    <h2>BUiLD 2026</h2>
    <div class="im"><img src="../assets/day0-1.jpg" alt="BUiLD 主视觉"></div>
    <div class="meta">
      <span><b>时间</b>2026 年 3 月</span>
      <span><b>筹备</b>活动前 3 天定型</span>
      <span><b>预算</b>有限，靠社区</span>
      <span><b>角色</b>策略 · 物料 · 落地</span>
    </div>
  </div>
  <div class="cc">
    <h3>物料</h3>
    <div class="g">
      <div class="gi"><img src="../assets/day0-1.jpg"><span>Day 0 · 倒计时海报</span></div>
      <div class="gi"><img src="../assets/bonjour-day2-1.jpg"><span>Day 2 · 倒计时海报</span></div>
      <div class="gi"><img src="../assets/ama.jpg"><span>AMA 对谈海报</span></div>
      <div class="gi"><img src="../assets/card-poster.jpg"><span>数字名片海报</span></div>
    </div>
  </div>
  <div class="cr">
    <h3>现场</h3>
    <div class="im"><img src="../assets/bonjour-084.jpg" alt=""></div>
    <div class="say">
      <div class="t">把社区自己变成传播者</div>
      <div class="d">每张物料都由 builder 的真实作品说话。当天的新增与建联，大半来自老用户的主动转发。</div>
    </div>
  </div>
</div>
<div class="foot">P.16</div>
</body></html>
