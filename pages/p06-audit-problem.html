<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>P.06 审核问题</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:#0f1012;color:var(--paper);
  font-family:"Noto Sans CJK SC",sans-serif;}
/* R16-2：顶部横图带 x13%→87% y9%→30% */
.band{position:absolute;left:13%;right:13%;top:9%;height:21%;overflow:hidden;}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;
  filter:grayscale(1) contrast(1.2) brightness(1.0);}
.band .ink{position:absolute;inset:0;background:#1D4B96;mix-blend-mode:color;opacity:.85;}
/* 四栏 y=31% */
.c1{position:absolute;left:13%;top:33%;font-size:13.5px;font-weight:600;}
.c2{position:absolute;left:32%;top:33%;font-size:13.5px;color:rgba(242,240,232,.6);}
.c3{position:absolute;left:51%;top:33%;width:15%;font-size:13px;line-height:2.05;color:rgba(242,240,232,.82);}
.c3 p{margin-bottom:18px;}
.c3 .sig{font-size:12px;color:rgba(242,240,232,.5);}
.c4{position:absolute;left:69%;top:33%;width:18%;font-size:13px;line-height:1.9;color:rgba(242,240,232,.82);}
.c4 .hd{color:var(--paper);font-weight:600;margin-bottom:14px;}
.c4 .sub{color:rgba(242,240,232,.5);margin:18px 0 6px;}
.foot{position:absolute;right:13%;bottom:5%;font-size:12px;letter-spacing:.18em;color:rgba(242,240,232,.4);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head><body>
<div class="band"><img loading="lazy" decoding="async" src="../assets/gloves.jpg" alt=""><div class="ink"></div></div>
<div class="c1">业务 API</div>
<div class="c2">背景</div>
<div class="c3">
  <p>小工具里的作品可以被使用，创作成果却不容易进入社区内容流。</p>
  <p>作者希望作品被看见，也希望用户能关注和分享。平台需要把工具创作与笔记、互动连接起来。</p>
  <p class="sig">我把这个需求拆成站内业务接口。</p>
</div>
<div class="c4">
  <div class="hd">创作与传播的连接</div>
  ① 工具内创作，形成作品
  <div class="sub">创作者的产品与内容供给</div>
  ② 发笔记、评论，进入社区
  <div class="sub">作品可见，互动可发生</div>
  ③ 关注、分享，连接回作者
  <div class="sub">传播与作者经营接续起来</div>
</div>
<div class="foot">P.06</div>
</body></html>
