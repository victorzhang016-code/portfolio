<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>P.04 小红书</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:#fff;color:var(--ink);
  font-family:"Noto Sans CJK SC",sans-serif;}
/* R02-1: 顶部导航（左字标 / 右菜单）y≈6.5% */
.nav{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;
  justify-content:space-between;padding:0 13.5%;font-size:14px;}
.nav .word{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:17px;}
.nav .menu{display:flex;gap:34px;color:rgba(32,35,35,.75);font-size:13.5px;}
.nav .menu span:last-child{color:rgba(32,35,35,.45);}
/* 标题（x 12.2% y 17%）*/
h1{position:absolute;left:12.2%;top:15%;font-family:"Noto Serif CJK SC",serif;font-weight:900;
  font-size:58px;line-height:1.1;}
/* 两行描述（x 12.2% y 25.5%）*/
.desc{position:absolute;left:12.2%;top:25.5%;width:35%;font-size:15px;line-height:1.75;color:rgba(32,35,35,.75);}
/* 标签组（x 12.2% y 31%）*/
.tags{position:absolute;left:12.2%;top:31.5%;display:flex;gap:10px;}
.tags span{font-size:12.5px;padding:6px 14px;border:1px solid rgba(32,35,35,.28);border-radius:999px;color:rgba(32,35,35,.7);}
/* 右 About 按钮（y 31.5%）*/
.about{position:absolute;right:13.5%;top:31.5%;font-size:13px;font-weight:600;
  border:1px solid rgba(32,35,35,.3);padding:8px 18px;border-radius:3px;color:var(--ink);}
/* 满幅主视觉（x 12.2% → 87.8%，y 37% 到底）*/
.hero{position:absolute;left:12.2%;right:12.2%;top:37%;bottom:0;overflow:hidden;background:#0E2350;}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;
  filter:grayscale(1) contrast(1.2) brightness(1.02);}
.hero .ink{position:absolute;inset:0;background:#1D4B96;mix-blend-mode:color;}
.hero .depth{position:absolute;inset:0;background:#0C2450;mix-blend-mode:multiply;opacity:.35;}
.hero .dots{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.09;
  background-image:radial-gradient(rgba(20,35,70,.9) 1px, transparent 1.4px);background-size:5px 5px;}
.hero .cap{position:absolute;left:26px;bottom:20px;font-size:12.5px;letter-spacing:.2em;color:rgba(242,240,232,.85);}
.hero .num{position:absolute;right:26px;top:20px;font-family:"Noto Serif CJK SC",serif;font-weight:900;
  font-size:15px;letter-spacing:.14em;color:rgba(242,240,232,.85);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head><body>
<div class="nav"><div class="word">小红书 · RedSkill</div>
  <div class="menu"><span>业务与生态</span><span>审核外露</span><span>开放能力</span><span>商业化</span></div></div>
<h1>B 端 AI 创作生态</h1>
<div class="desc">小工具与 Skill 两种供给，共享同一条「发现—使用—再传播」链路。<br>我负责供需策略、审核外露与开放能力的产品工作。</div>
<div class="tags"><span>供需策略</span><span>审核外露</span><span>开放能力</span></div>
<div class="about">关于这个项目 +</div>
<div class="hero">
  <img src="../assets/gloves.jpg" alt="Get hands dirty 手套">
  <div class="ink"></div><div class="depth"></div><div class="dots"></div>
  <div class="num">CASE 01 · 2026</div>
  <div class="cap">GET HANDS DIRTY · B 端 AI 创作生态</div>
</div>
</body></html>
