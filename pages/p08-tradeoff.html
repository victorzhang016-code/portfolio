<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>P.08 关键取舍</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:#101114;color:var(--paper);
  font-family:"Noto Sans CJK SC",sans-serif;}
/* R18-1：顶栏 y≈16% */
.nav{position:absolute;left:0;right:0;top:0;height:16%;display:flex;align-items:center;
  justify-content:space-between;padding:0 13.5%;font-size:13px;letter-spacing:.1em;}
.nav .grp{display:flex;gap:44px;color:rgba(242,240,232,.6);}
.nav .word{color:var(--paper);font-weight:600;}
/* 白纸 x13.5%→86.5% y30%→底 */
.sheet{position:absolute;left:13.5%;right:13.5%;top:30%;bottom:0;background:#EAE8E2;color:var(--ink);}
/* 纸上两端：约束（安静小字栏） */
.con{position:absolute;top:9%;width:21%;font-size:12.5px;line-height:1.85;color:rgba(32,35,35,.72);}
.con .ck{font-size:11.5px;letter-spacing:.24em;color:rgba(32,35,35,.5);display:block;margin-bottom:12px;}
.con b{color:var(--ink);}
.con.l{left:5.5%;} .con.r{right:5.5%;text-align:left;}
/* 立在纸上的深蓝「书」：方案 */
.book{position:absolute;left:37%;top:7%;width:26%;bottom:0;background:var(--deep);color:var(--paper);
  padding:30px 30px 0;box-shadow:10px 12px 28px rgba(21,58,117,.28);}
.book .bk{font-size:11.5px;letter-spacing:.26em;color:var(--warm);}
.book h3{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:22px;line-height:1.5;margin:12px 0 18px;}
.ly{border-left:3px solid rgba(242,240,232,.7);padding:8px 0 8px 14px;margin-bottom:4px;
  display:flex;justify-content:space-between;align-items:baseline;font-size:14px;}
.ly .s{font-size:11px;color:rgba(242,240,232,.62);}
.ly.core{background:rgba(35,89,209,.4);border-left-color:#fff;}
.cn{margin:-2px 0 -2px 3px;height:16px;border-left:1.5px dashed rgba(242,240,232,.5);position:relative;}
.cn span{position:absolute;left:8px;top:0;font-size:10px;color:rgba(242,240,232,.6);letter-spacing:.12em;}
.gate{margin-top:14px;border-top:1px dashed rgba(242,240,232,.45);padding-top:11px;
  font-size:11.5px;line-height:1.75;color:rgba(242,240,232,.8);}
/* 标题压纸缘 */
.q{position:absolute;left:5.5%;bottom:5%;font-family:"Noto Serif CJK SC",serif;font-weight:900;
  font-size:24px;line-height:1.5;color:var(--ink);width:26%;}
.foot{position:absolute;right:13.5%;top:18.5%;font-size:12px;letter-spacing:.18em;color:rgba(242,240,232,.45);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head><body>
<div class="nav">
  <div class="grp">小红书<span>Builder Hub</span><span>AI API</span></div>
  <div class="word">平台统一提供 AI 能力</div>
</div>
<div class="sheet">
  <div class="con l"><span class="ck">开发者需要</span>
    在小工具里使用 AI：<br><br>
    <b>01</b> 接入简单<br><b>02</b> 服务稳定<br><b>03</b> 能专注作品体验<br><br>
    <span style="color:rgba(32,35,35,.5)">能力应当自然进入创作流程。</span></div>
  <div class="book">
    <span class="bk">我的方案 · 产品 owner</span>
    <h3>平台提供模型<br>开发者直接使用</h3>
    <div class="ly core"><span>平台 AI API</span><span class="s">统一接入</span></div>
    <div class="cn"><span>产品化交付</span></div>
    <div class="ly"><span>开发者小工具</span><span class="s">轻量接入</span></div>
    <div class="cn"></div>
    <div class="ly"><span>用户体验</span><span class="s">更丰富的 AI 作品</span></div>
    <div class="gate">我主导产品方案、模型选择、安全机制与接入文档，并协同研发推动上线。</div>
  </div>
  <div class="con r"><span class="ck">平台负责</span>
    统一提供能力：<br><br>
    <b>01</b> 服务管理<br><b>02</b> 内容安全<br><b>03</b> 接入体验<br><b>04</b> 能力持续扩展<br><br>
    <span style="color:rgba(32,35,35,.5)">开放能力，让开发者专注创作。</span></div>
  <div class="q">让 AI 能力好接入，<br>也能被放心使用。</div>
</div>
<div class="foot">P.08</div>
</body></html>
