<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>电话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;
 font-family:"Lucida Grande","Helvetica Neue","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
.stage{position:absolute;inset:0;padding:5% 8%;display:flex;flex-direction:column;
 background:repeating-linear-gradient(0deg,transparent 0,transparent 1.5px,rgba(255,255,255,.85) 1.5px,rgba(255,255,255,.85) 4px),linear-gradient(#ececec,#ececec);}
.card{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.18);
 box-shadow:0 20px 50px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9);
 padding:52px 60px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.icon{width:110px;height:110px;border-radius:24px;overflow:hidden;
 box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.7);}
.icon img{width:100%;height:100%;}
h1{margin-top:28px;font-size:34px;color:#1c1c1e;font-weight:700;}
.sub{margin-top:10px;font-size:16px;color:#6b6b70;line-height:1.6;text-align:center;}
.num{margin-top:30px;font-size:42px;font-weight:700;color:#1c1c1e;letter-spacing:.02em;
 font-family:"Lucida Grande","Helvetica Neue",sans-serif;}
.btn{margin-top:34px;display:inline-flex;align-items:center;gap:9px;
 background:linear-gradient(180deg,#6db3f2 0%,#3a80d3 50%,#2c68b8 100%);
 color:#fff;font-size:17px;font-weight:600;text-decoration:none;
 padding:13px 34px;border-radius:10px;border:1px solid rgba(0,0,0,.25);
 box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 6px 16px rgba(42,100,190,.4);
 text-shadow:0 -1px 0 rgba(0,0,0,.25);}
.btn:active{background:linear-gradient(180deg,#3a80d3,#2c68b8);}
.foot{position:absolute;right:8%;bottom:3.4%;font-size:11.5px;letter-spacing:.16em;color:rgba(60,60,64,.5);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head>
<body><div class="stage">
  <div class="card">
    <div class="icon"><img loading="lazy" decoding="async" src="../assets/icon-phone.png"></div>
    <h1>电话</h1>
    <div class="sub">如果你想了解更多，欢迎联系我！</div>
    <div class="num">183 2918 9845</div>
    <div class="btn" onclick="copyVal('18329189845')">⧉ 复制电话</div>
  </div>
  <div class="foot">CONTACT · PHONE</div>
</div>

<script>
function copyVal(v){
  const done=()=>toast('已复制到剪贴板');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(done).catch(()=>fb(v));}
  else fb(v);
  function fb(){const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();toast('已复制到剪贴板');}
}
function toast(msg){
  let t=document.getElementById('_cpToast');
  if(!t){t=document.createElement('div');t.id='_cpToast';
    t.style.cssText='position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(30,30,32,.88);color:#fff;font-size:14px;padding:10px 24px;border-radius:999px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;';
    document.body.appendChild(t);}
  t.textContent=msg;requestAnimationFrame(()=>t.style.opacity='1');
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',1600);
}
</script></body></html>
