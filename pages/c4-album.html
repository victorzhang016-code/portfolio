<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>Other Work · 相册</title>
<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#B8912E;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased;}
.noise{position:absolute;inset:0;opacity:.035;mix-blend-mode:multiply;pointer-events:none;z-index:9;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.top{position:absolute;left:4.4%;right:4.4%;top:5.6%;display:flex;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;border-bottom:1.5px solid rgba(32,35,35,.9);}
.top .no{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:15px;}
.top .no b{color:var(--cobalt);}
.top .h{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:26px;}
.top .r{font-size:12px;letter-spacing:.16em;color:rgba(32,35,35,.55);text-align:right;line-height:1.7;}
.gal{position:absolute;left:4.4%;right:4.4%;top:15.5%;bottom:8%;display:grid;
  grid-template-columns:1.62fr 1fr;grid-template-rows:1fr 1fr;gap:16px;}
.ph{position:relative;overflow:hidden;border:1.5px solid rgba(32,35,35,.85);background:#0d1a33;}
.ph img{width:100%;height:100%;object-fit:cover;object-position:var(--pp,50% 50%);transition:transform .5s;}
.ph:hover img{transform:scale(1.04);}
.ph.feat{grid-row:span 2;}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 15px;z-index:2;
  background:linear-gradient(0deg,rgba(6,14,30,.94),rgba(6,14,30,0));}
.ph .cap .t{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:18px;color:var(--paper);}
.ph.feat .cap .t{font-size:24px;}
.ph .cap .s{margin-top:5px;font-size:11.5px;letter-spacing:.12em;color:rgba(242,240,232,.74);}
.ph .tag{position:absolute;left:15px;top:14px;z-index:2;font-size:10.5px;letter-spacing:.14em;
  padding:4px 10px;background:rgba(6,14,30,.5);color:rgba(242,240,232,.92);backdrop-filter:blur(3px);}
.foot{position:absolute;left:4.4%;right:4.4%;bottom:3.2%;display:flex;justify-content:space-between;
  font-size:12px;letter-spacing:.16em;color:rgba(32,35,35,.45);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head><body><div class="noise"></div>
<div class="top">
  <div class="no"><b>CASE 04</b> ｜ Other Work</div>
  <div class="h">软件之前，我先做过空间</div>
  <div class="r">建筑 / 交互装置 / 概念设计<br>概念转译 · 真实建造 · 渲染与图纸</div>
</div>
<div class="gal">
  <div class="ph feat" style="--pp:26% 42%">
    <span class="tag">eVolo · 摩天楼竞赛</span>
    <img loading="lazy" decoding="async" src="../assets/evolo-01.jpg">
    <div class="cap"><div class="t">Floating Elysium</div><div class="s">悬浮城市概念 · 概念设计</div></div>
  </div>
  <div class="ph" style="--pp:50% 46%">
    <span class="tag">交互装置 · 渲染</span>
    <img loading="lazy" decoding="async" src="../assets/df-cubes.jpg">
    <div class="cap"><div class="t">DF · 空间交互实验</div><div class="s">起点场景 · 观演与停留</div></div>
  </div>
  <div class="ph" style="--pp:50% 50%">
    <span class="tag">交互装置 · 轴测</span>
    <img loading="lazy" decoding="async" src="../assets/df-drawing.webp">
    <div class="cap"><div class="t">DF · 流线与分区</div><div class="s">路径推演 · 空间叙事</div></div>
  </div>
</div>
<div class="foot"><span>Other Work · 建筑作品相册</span><span>团队项目标注本人负责部分 · 图纸详备索 ｜ 更多建筑作品陆续补充</span></div>
</body></html>
