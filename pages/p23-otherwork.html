<!DOCTYPE html>

<style>
:root{--deep:#153A75;--cobalt:#2359D1;--paper:#F2F0E8;--ink:#202323;--warm:#DCCB80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;background:#0c0d0f;color:var(--paper);

/* 顶部 meta 多列 */
.meta{position:absolute;left:0;right:0;top:0;height:24%;padding:5.5% 1.2% 0;

.strip{position:absolute;left:0;right:0;bottom:0;height:56%;display:flex;align-items:flex-end;

.proj .lb b{font-family:"Noto Serif CJK SC",serif;font-weight:900;font-size:14px;}
.proj .lb span{color:rgba(242,240,232,.5);}
.proj .th{display:flex;gap:10px;}
.proj .th img{display:block;object-fit:cover;}
.proj.txt{justify-content:flex-end;}
.proj.txt .box{width:230px;background:#17181b;padding:22px 20px;font-size:12.5px;line-height:1.8;
  color:rgba(242,240,232,.75);border-left:2px solid var(--cobalt);}
.p1 .th img{height:250px;width:200px;}
.p2 .th img{height:250px;width:190px;}
.p3 .th img{height:250px;width:230px;}
.p4 .th img{height:250px;width:200px;}
.foot{position:absolute;right:1.2%;top:5.5%;font-size:12px;letter-spacing:.18em;color:rgba(242,240,232,.45);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
