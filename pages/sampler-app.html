</style></head><body><div class="app">
<header class="topbar"><div class="app-brand"><div class="mark" aria-hidden="true">采</div><div><strong>灵感采样器</strong><span>从收藏，到创作</span></div></div><div class="top-actions"><span class="board-name">当前画布 · Wearlog 界面灵感</span><button class="quiet" id="resetBtn">重置示例</button><button class="primary" id="newBoardBtn">新建画布</button></div></header>
<nav class="steps" aria-label="采样器工作流"><button class="step-tab" data-step="sample" aria-current="step"><span class="n">01</span><span>采样</span></button><button class="step-tab" data-step="organize"><span class="n">02</span><span>整理</span></button><button class="step-tab" data-step="export"><span class="n">03</span><span>交给 Agent</span></button></nav>
<main class="workspace"><aside class="library"><div class="section-title">收藏笔记 <small>灵感来源</small></div><div class="hint">选择参考，标出你想带走的设计线索。</div><input class="search" id="search" aria-label="搜索收藏笔记" placeholder="搜索灵感素材"><div class="source-list" id="sourceList"></div></aside><section class="canvas" id="mainCanvas"></section><aside class="inspector" id="inspector"></aside></main>
<footer class="footer"><div class="left"><span>保留灵感出处</span><span class="sep"></span><span>带走设计关系</span></div><span>本地交互 Demo · 灵感采样器</span></footer><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<script>
(()=>{'use strict';
const SOURCES=[
{id:'warm',title:'柔和空间的色彩关系',kind:'色彩线索',detail:'低饱和暖色 · 柔和对比',art:'art-warm'},
{id:'grid',title:'标题与网格的节奏',kind:'版式线索',detail:'衬线标题 · 清晰层级',art:'art-grid'},
{id:'shape',title:'形状与留白的秩序',kind:'构图线索',detail:'几何形态 · 轻重平衡',art:'art-shape'}
];
const STORAGE='portfolio-sampler-board-v1';let selected=['warm','grid'];let step='sample';let extracted={color:false,tone:false,type:false};let toastTimer;
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&Array.isArray(saved.selected))selected=saved.selected.filter(id=>SOURCES.some(x=>x.id===id));}catch(e){}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({selected}));}catch(e){}}
function notify(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function artClass(x){return 'source-art '+x.art}
function renderSources(){const q=$('#search').value.trim().toLowerCase();$('#sourceList').innerHTML=SOURCES.filter(x=>(x.title+x.kind+x.detail).toLowerCase().includes(q)).map(x=>{const on=selected.includes(x.id);return `<article class="source ${on?'selected':''}"><div class="${artClass(x)}" aria-hidden="true"></div><div class="source-meta"><b>${esc(x.title)}</b><span>${esc(x.kind)}</span></div><button class="add-source" data-toggle="${x.id}" aria-pressed="${on}">${on?'已加入画布':'＋ 采样到画布'}</button></article>`}).join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>toggleSource(b.dataset.toggle)));}
function toggleSource(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];save();renderSources();renderMain();notify(selected.includes(id)?'已加入灵感画布':'已从画布移除');}
function card(x){return `<article class="board-card"><div class="${artClass(x)}" aria-hidden="true"></div><button class="remove-card" data-remove="${x.id}" aria-label="移除${esc(x.title)}">×</button><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></article>`}
function sampleMain(){const items=SOURCES.filter(x=>selected.includes(x.id));return `<div class="canvas-head"><div><h1>把参考放进画布</h1><p>选中的灵感会保留来源，之后可以继续整理。</p></div><div class="canvas-actions"><button class="small-btn" data-go="organize">整理线索 →</button></div></div><div class="board">${items.length?items.map(card).join(''):`<div class="empty"><strong>画布还是空的</strong><span>从左侧收藏中采样一条灵感开始。</span></div>`}</div><div class="note"><b>采样方式</b><p>标记颜色、构图或字形等取用点，再把它们带进自己的作品。采样只整理线索，<em>创作由你完成</em>。</p></div>`}
function organizeMain(){return `<div class="canvas-head"><div><h1>整理成可复用的设计线索</h1><p>对照选中的素材，补上你想带走的设计关系。</p></div><div class="canvas-actions"><button class="small-btn" data-go="sample">← 返回采样</button><button class="small-btn" data-go="export">生成说明 →</button></div></div><div class="board board-organize"><section class="organize-block"><div class="block-k">色彩</div><div class="large-swatches"><i style="--sw:#e7d7bf"></i><i style="--sw:#b9846b"></i><i style="--sw:#f3eee4"></i><i style="--sw:#2359d1"></i></div><p>暖纸色作为底，深色建立结构，亮色只落在关键位置。</p></section><section class="organize-block"><div class="block-k">氛围</div><div class="tone-list"><span>温和</span><span>克制</span><span>有呼吸感</span></div><p>用留白减轻信息压力，让视觉重点先被看到。</p></section><section class="organize-block"><div class="block-k">字体关系</div><div class="type-display">Build with intent.<small>标题用衬线建立个性，正文保持清晰。</small></div></section><section class="organize-block relation"><div class="block-k">设计关系</div><div class="relation-line"><b>色彩定氛围</b><i></i><b>排版定顺序</b><i></i><b>留白定节奏</b></div><p>把元素之间的关系写清楚，比孤立复制一个参考更容易落到新作品里。</p></section></div>`}
function markdown(){const names=SOURCES.filter(x=>selected.includes(x.id)).map(x=>`- ${x.title}（${x.kind}：${x.detail}）`).join('\n')||'- 尚未添加来源';return `# 设计说明\n\n## 方向\n以温和、克制的视觉语言呈现内容，先建立清晰层级，再用有限的色彩突出重点。\n\n## 色彩\n- 暖纸色作为页面底色\n- 深色承担文字与结构\n- 强调色只用于关键操作和视觉焦点\n\n## 字体与排版\n- 标题使用有性格的衬线字体\n- 正文保证清晰易读\n- 通过留白建立阅读节奏\n\n## 灵感来源\n${names}\n\n## 使用边界\n保留来源标注；借鉴设计关系，不直接复制原作品。\n`}
function exportMain(){return `<div class="canvas-head"><div><h1>整理完成，交给 Agent 继续实现</h1><p>将设计意图、组件关系与灵感来源收在同一份说明里。</p></div><div class="canvas-actions"><button class="small-btn" data-go="organize">← 返回整理</button><button class="primary" id="downloadBtn">下载 design.md</button></div></div><div class="output active"><pre class="output-code">${esc(markdown())}</pre><aside class="output-side"><h3>灵感来源</h3><p>设计说明保留每条参考的取用点，后续可以追溯灵感从哪里来。</p>${SOURCES.filter(x=>selected.includes(x.id)).map(x=>`<div class="source-ref">${esc(x.title)}<span>${esc(x.kind)} · ${esc(x.detail)}</span></div>`).join('')||'<div class="source-ref">还没有采样来源<span>返回左侧选择灵感素材</span></div>'}</aside></div><div class="note"><b>下一步</b><p>把 design.md 提供给 coding agent，继续搭建自己的作品；发布时保留灵感来源。</p></div>`}
function renderInspector(){const i=$('#inspector');if(step==='export'){i.innerHTML=`<div class="section-title">交付检查 <small>设计说明</small></div><div class="tool"><h3>内容完整</h3><p>方向、色彩、字体关系与来源已经整理在 design.md 中。</p><button id="copyBtn">复制设计说明</button></div><div class="tool"><h3>来源可追溯</h3><p>每条灵感都保留取用点，便于回看原始参考。</p><button data-go="sample">回到灵感库</button></div>`;$('#copyBtn').addEventListener('click',copyMarkdown);return;}
i.innerHTML=`<div class="section-title">提炼工具 <small>从线索到规则</small></div><div class="tool"><h3>色彩提取</h3><p>从画布中的配色参考，整理出页面底色与强调色。</p><button data-tool="color">${extracted.color?'已提取色彩':'提取色彩'}</button>${extracted.color?'<div class="palette"><div class="swatch"><i style="background:#e7d7bf"></i><span>暖纸色</span></div><div class="swatch"><i style="background:#2359d1"></i><span>钴蓝</span></div><div class="swatch"><i style="background:#e8243e"></i><span>强调色</span></div></div>':''}</div><div class="tool"><h3>氛围提炼</h3><p>把零散的情绪参考，收敛成可沟通的方向。</p><button data-tool="tone">${extracted.tone?'已提炼氛围':'提炼氛围'}</button>${extracted.tone?'<div class="tone-list"><span class="tone">温和</span><span class="tone">克制</span><span class="tone">清晰</span></div>':''}</div><div class="tool"><h3>字体配对</h3><p>明确标题与正文的层级关系。</p><button data-tool="type">${extracted.type?'已整理字级':'整理字体关系'}</button>${extracted.type?'<div class="type-sample">标题 / Noto Serif<small>正文 / Noto Sans</small></div>':''}</div><div class="tool"><button data-go="organize">进入整理 →</button></div>`;
i.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{extracted[b.dataset.tool]=true;renderInspector();notify('线索已加入设计说明');}));i.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setStep(b.dataset.go)));}
function renderMain(){const c=$('#mainCanvas');if(step==='sample'){c.innerHTML=sampleMain();c.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>toggleSource(b.dataset.remove)));}else if(step==='organize')c.innerHTML=organizeMain();else c.innerHTML=exportMain();c.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setStep(b.dataset.go)));$('#downloadBtn')?.addEventListener('click',downloadMarkdown);renderInspector();}
function setStep(next){step=next;document.querySelectorAll('.step-tab').forEach(b=>{if(b.dataset.step===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});renderMain();}
function copyMarkdown(){const text=markdown();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>notify('design.md 已复制')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');notify('design.md 已复制')}catch(e){notify('复制未成功，可下载文件')}ta.remove()}
function downloadMarkdown(){const blob=new Blob([markdown()],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='design.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('design.md 已下载')}
document.querySelectorAll('.step-tab').forEach(b=>b.addEventListener('click',()=>setStep(b.dataset.step)));$('#search').addEventListener('input',renderSources);$('#newBoardBtn').addEventListener('click',()=>{selected=[];save();renderSources();renderMain();notify('已新建空白画布')});$('#resetBtn').addEventListener('click',()=>{selected=['warm','grid'];extracted={color:false,tone:false,type:false};save();setStep('sample');renderSources();notify('示例画布已重置')});renderSources();renderMain();
})();
</script></body></html>
