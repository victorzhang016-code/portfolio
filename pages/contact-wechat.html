<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>微信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;
 font-family:"Lucida Grande","Helvetica Neue","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
.stage{position:absolute;inset:0;padding:5% 8%;display:flex;flex-direction:column;
 background:repeating-linear-gradient(0deg,transparent 0,transparent 1.5px,rgba(255,255,255,.85) 1.5px,rgba(255,255,255,.85) 4px),linear-gradient(#ececec,#ececec);}
.card{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.18);
 box-shadow:0 20px 50px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9);
 padding:48px 60px;flex:1;display:flex;align-items:center;justify-content:center;gap:70px;}
.left{display:flex;flex-direction:column;align-items:flex-start;}
.icon{width:96px;height:96px;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 26px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.7);}
.icon img{width:100%;height:100%;}
h1{margin-top:22px;font-size:32px;color:#1c1c1e;font-weight:700;}
.sub{margin-top:8px;font-size:15.5px;color:#6b6b70;line-height:1.65;}
/* Aqua 凹槽二维码区 */
.qr{width:340px;height:340px;border-radius:14px;padding:22px;
 background:repeating-linear-gradient(0deg,transparent 0,transparent 1.5px,rgba(255,255,255,.55) 1.5px,rgba(255,255,255,.55) 4px),linear-gradient(#f8f8f8,#dcdcdc);
 border:1px solid rgba(0,0,0,.24);
 box-shadow:inset 0 2px 4px rgba(0,0,0,.14),inset 0 -1px 0 rgba(255,255,255,.6);}
.qr img{width:100%;height:100%;object-fit:contain;border-radius:6px;}
.foot{position:absolute;right:8%;bottom:3.4%;font-size:11.5px;letter-spacing:.16em;color:rgba(60,60,64,.5);}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head>
<body><div class="stage">
  <div class="card">
    <div class="left">
      <div class="icon"><img loading="lazy" decoding="async" src="../assets/icon-wechat.png"></div>
      <h1>微信</h1>
      <div class="sub">如果你想了解更多，欢迎联系我！<br>扫一扫上面的二维码，加我微信。<br>欢迎备注你的来意。</div>
    </div>
    <div class="qr"><img loading="lazy" decoding="async" src="../assets/wechat-qr.png" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:14px>二维码待放置</div>';"></div>
  </div>
  <div class="foot">CONTACT · WECHAT</div>
</div>
</body></html>
