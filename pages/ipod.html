<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>iPod</title>
<style>
/* ═══ ryOS iPod 复刻：现代彩屏 + 角度旋转轮盘（纯 iPod 视图） ═══ */
:root{--myriad:"MyriadPro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;
 font-family:var(--myriad);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}

/* ── iPod 机身 ── */
.ipod{width:calc((100vh - 12px) * 0.506);height:calc(100vh - 12px);border-radius:min(34px,4.2vh);padding:max(18px,3.8vh) max(18px,3.8vh) max(22px,4.4vh);
 display:flex;flex-direction:column;align-items:center;position:relative;
 background:linear-gradient(105deg,#fbfaf7 0%,#f4f2ec 30%,#e9e6de 65%,#dfdbd2 100%);
 box-shadow:0 34px 90px rgba(0,0,0,.5),0 6px 22px rgba(0,0,0,.25),
  inset 0 2px 3px rgba(255,255,255,.95),inset 0 -4px 12px rgba(0,0,0,.07),inset 3px 0 8px rgba(255,255,255,.4),inset -3px 0 8px rgba(0,0,0,.04);}

/* ── 现代 LCD ── */
.ipod-screen{width:100%;height:41%;border:2px solid #000;border-radius:3px;overflow:hidden;position:relative;
 background:#fff;user-select:none;-webkit-user-select:none;}
.ipod-titlebar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;overflow:hidden;flex-shrink:0;
 background-image:linear-gradient(180deg,#feffff 0%,#b1b6b9 100%);box-shadow:inset 0 -1px 0 #939393;
 font-size:14px;font-weight:700;color:#000;position:relative;z-index:2;flex-shrink:0;}
.tb-right{display:flex;align-items:center;gap:7px;font-weight:400;color:rgb(99,101,103);font-size:12px;}
.battery{width:26px;height:13px;border:1px solid #626262;border-radius:2px;position:relative;
 background-color:#54585b;background-image:linear-gradient(180deg,transparent 25%,transparent 65%,rgba(255,255,255,.5) 100%);overflow:hidden;}
.battery::after{content:"";position:absolute;right:-4px;top:3px;width:3px;height:5px;background:#c4c4c4;border:1px solid #626262;border-radius:0 1px 1px 0;}
.battery .lvl{position:absolute;left:1px;top:1px;bottom:1px;width:80%;background:#A5E07F;border-radius:1px;
 background-image:linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 50%);}
.ipod-body{height:calc(100% - 28px);display:flex;position:relative;overflow:hidden;}
.menu-col{flex:1;overflow:hidden;position:relative;background:#fff;}
.menu-row{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;font-size:15px;
 color:#000;background:#fff;transition:background .06s;cursor:pointer;}
.menu-row .val{color:rgb(99,101,103);font-size:14px;}
.menu-row.selected{background-image:linear-gradient(180deg,rgb(60,184,255) 0%,rgb(52,122,181) 100%);color:#fff;}
.menu-row.selected .val{color:rgba(255,255,255,.85);}
/* Now Playing */
.np{display:flex;flex-direction:column;width:100%;padding:0 16px;background:#fff;overflow:hidden;}
.np-head{font-size:14px;font-weight:700;color:#000;padding:10px 2px 4px;display:flex;justify-content:space-between;flex-shrink:0;}
.np-head .cnt{color:rgb(99,101,103);font-weight:400;font-size:12.5px;}
.np-info{padding:8px 4px 0;flex-shrink:0;}
.np-marquee{overflow:hidden;white-space:nowrap;font-size:16px;font-weight:700;color:#000;position:relative;}
.np-marquee span{display:inline-block;padding-right:32px;}
.np-marquee.over span{animation:mq 9s linear infinite;}
@keyframes mq{0%{transform:translateX(0);}12%{transform:translateX(0);}92%{transform:translateX(calc(-100% + 180px));}100%{transform:translateX(calc(-100% + 180px));}}
.np-artist{font-size:13px;color:rgb(99,101,103);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.np-prog{padding:8px 4px 8px;flex-shrink:0;}
.np-track{height:11px;border:1px solid #8c8c8c;border-radius:5px;background:linear-gradient(180deg,#fff,#d9d9d9);position:relative;overflow:hidden;cursor:pointer;}
.np-fill{height:100%;background:linear-gradient(180deg,#5a9ee6,#3470b3 45%,#2a5f99);border-radius:4px;width:0%;}
.np-knob{position:absolute;top:-2.5px;width:7px;height:14px;background:linear-gradient(180deg,#fff,#c9c9c9);border:1px solid #6f6f6f;border-radius:2px;left:0%;transform:translateX(-50%);}
.np-times{display:flex;justify-content:space-between;font-size:12px;color:#3f3f3f;margin-top:5px;padding:0 2px;}
.np-lrc{flex:1;min-height:0;overflow:hidden;position:relative;border-top:1px solid rgba(0,0,0,.08);margin-top:4px;}
.np-lrc-inner{position:absolute;left:0;right:0;transition:transform .35s cubic-bezier(.25,.1,.25,1);}
.np-lrc-line{padding:3px 14px;font-size:13px;line-height:1.4;color:rgb(150,152,156);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s;}
.np-lrc-line.cur{color:rgb(52,122,181);font-weight:700;}

/* 歌词全屏 */
.lrc-view{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;}
.lrc-head{height:28px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;flex-shrink:0;
 background-image:linear-gradient(180deg,#feffff 0%,#b1b6b9 100%);box-shadow:inset 0 -1px 0 #939393;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrc-scroll{flex:1;overflow:hidden;position:relative;padding:14px 0;}
.lrc-inner{transition:transform .35s cubic-bezier(.25,.1,.25,1);}
.lrc-line{padding:5px 16px;font-size:15px;line-height:1.45;color:rgb(140,142,146);transition:all .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrc-line.cur{color:#000;font-weight:700;font-size:16.5px;background:linear-gradient(180deg,rgba(60,184,255,.14),rgba(52,122,181,.1));}
.lrc-empty{display:flex;align-items:center;justify-content:center;height:100%;color:rgb(99,101,103);font-size:14px;}

/* ── 点击轮盘（ryOS IpodWheel 移植） ── */
.wheel-wrap{margin-top:auto;position:relative;width:78%;aspect-ratio:1;flex-shrink:0;}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;touch-action:none;user-select:none;cursor:grab;
 background:radial-gradient(circle at 35% 30%,#f8f6f1 0%,#e6e2d9 55%,#c9c4ba 100%);
 box-shadow:0 5px 16px rgba(0,0,0,.28),inset 0 2px 5px rgba(255,255,255,.8),inset 0 -5px 14px rgba(0,0,0,.1);}
.wheel:active{cursor:grabbing;}
.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36%;height:36%;border-radius:50%;z-index:10;
 display:flex;align-items:center;justify-content:center;cursor:pointer;
 background:radial-gradient(circle at 38% 32%,#f0eee8,#d7d3ca 70%,#c2bdb2);
 box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.85);}
.wheel-center:active{box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.6);}
.wheel-center svg{width:38%;height:38%;opacity:.78;}
.wl{position:absolute;color:#4a4a4a;font-weight:700;pointer-events:none;z-index:5;text-shadow:0 1px 0 rgba(255,255,255,.5);}
.wl-menu{top:4.5%;left:50%;transform:translateX(-50%);font-size:clamp(12px,2.2vh,16px);letter-spacing:.08em;}
.wl-next{right:6%;top:50%;transform:translateY(-50%);display:flex;}
.wl-prev{left:6%;top:50%;transform:translateY(-50%);display:flex;}
.wl-play{bottom:4.5%;left:50%;transform:translateX(-50%);display:flex;}
</style><link rel="stylesheet" href="../assets/fonts/fonts.css">
</head>

      items.map((it,i)=>`<div class="menu-row${i===menuIdx?' selected':''}">${it[0]}<span class="val">${it[1]}</span></div>`).join('')+`</div></div>`;
  }else if(view==='songs'){
    b.innerHTML=`<div class="menu-col"><div style="transition:transform .18s;" id="menuScroll">`+
      songs.map((s,i)=>`<div class="menu-row${i===songIdx?' selected':''}" style="padding-right:8px;"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i+1}. ${s.title}</span><span class="val">▸</span></div>`).join('')+`</div></div>`;
    const sc=$('menuScroll');if(sc)sc.style.transform=`translateY(-${Math.max(0,Math.min(songIdx-3,Math.max(0,songs.length-7)))*38}px)`;
  }else if(view==='nowplaying'){
    const s=songs[cur];
    b.innerHTML=`<div class="np">
      <div class="np-head"><span>${playing?'Now Playing':'Paused'}</span><span class="cnt">${cur+1} / ${songs.length}</span></div>
      <div class="np-info">
        <div class="np-marquee"><span id="npTitle">${s.title}</span></div>
        <div class="np-artist">${s.artist}</div>
      </div>
      <div class="np-prog">
        <div class="np-track" id="npTrack"><div class="np-fill" id="npFill"></div><div class="np-knob" id="npKnob"></div></div>
        <div class="np-times"><span id="npCur">0:00</span><span id="npDur">${fmt(audio.duration)}</span></div>
      </div>
      <div class="np-lrc" id="npLrc"><div class="np-lrc-inner">${
        lrcLines.length? lrcLines.map((l,i)=>`<div class="np-lrc-line${i===lrcIdx?' cur':''}" data-i="${i}">${l.t||'♪'}</div>`).join('') : ''
      }</div></div></div>`;
    const tk=$('npTrack');
    if(tk)tk.onclick=e=>{const r=tk.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||0);};
    // 跑马灯：文字超宽时滚动
    const mq=$('npTitle');
    if(mq&&mq.parentElement){
      requestAnimationFrame(()=>{
        if(mq.scrollWidth>mq.parentElement.clientWidth+4)mq.parentElement.classList.add('over');
        else mq.parentElement.classList.remove('over');
      });
    }
  }else if(view==='lyrics'){
    b.innerHTML=`<div class="lrc-view"><div class="lrc-head">${songs[cur].title}</div>
      <div class="lrc-scroll"><div class="lrc-inner" id="lrcInner">${
        lrcLines.length? lrcLines.map((l,i)=>`<div class="lrc-line${i===lrcIdx?' cur':''}">${l.t||'♪'}</div>`).join('') :
        '<div class="lrc-empty">这首歌没有歌词</div>'
      }</div></div></div>`;
    scrollLyric();
  }
}
function syncPlayState(){
  $('tbState').textContent=playing?'▶':'❙❙';
  const p=$('centerPath');
  if(p)p.setAttribute('d',playing?'M6 5h4v14H6zM14 5h4v14h-4z':'M8 5v14l11-7z');
  if(view==='nowplaying')renderScreen();
}
function updateProgress(){
  if(view!=='nowplaying')return;
  const f=$('npFill'),k=$('npKnob');
  if(f&&audio.duration){const pc=audio.currentTime/audio.duration*100;f.style.width=pc+'%';k.style.left=pc+'%';}
  const c=$('npCur');if(c)c.textContent=fmt(audio.currentTime);
  const d=$('npDur');if(d)d.textContent='-'+fmt((audio.duration||0)-audio.currentTime);
}
function updateLyric(){
  if(!lrcLines.length||view!=='lyrics')return;
  let idx=-1;
  for(let i=0;i<lrcLines.length;i++){if(lrcLines[i].time<=audio.currentTime+.12)idx=i;else break;}
  if(idx!==lrcIdx){
    lrcIdx=idx;
    document.querySelectorAll('.lrc-line').forEach((el,i)=>el.classList.toggle('cur',i===lrcIdx));
    document.querySelectorAll('.np-lrc-line').forEach((el,i)=>el.classList.toggle('cur',i===lrcIdx));
    scrollLyric();scrollNpLrc();
  }
}
function scrollNpLrc(){
  const inner=document.querySelector('.np-lrc-inner');if(!inner)return;
  const curEl=inner.children[lrcIdx];if(!curEl)return;
  const sc=inner.parentElement;
  const target=-(curEl.offsetTop-sc.offsetHeight/2+curEl.offsetHeight/2);
  inner.style.transform=`translateY(${Math.min(0,target)}px)`;
}
function scrollLyric(){
  const inner=$('lrcInner');if(!inner)return;
  const curEl=inner.children[lrcIdx];if(!curEl)return;
  const sc=inner.parentElement;
  const target=-(curEl.offsetTop-sc.offsetHeight/2+curEl.offsetHeight/2);
  inner.style.transform=`translateY(${Math.min(0,target)}px)`;
}

async function playSong(i){
  cur=i;view='nowplaying';
  const s=songs[i];
  audio.src=s.src;audio.play().catch(()=>{});
  lrcLines=[];lrcIdx=-1;
  if(s.lyrics&&s.lyrics.length){
    lrcLines=s.lyrics.map(l=>({time:l[0],t:l[1]}));
  }
  renderScreen();
}
function parseLRC(txt){
  const out=[];
  for(const line of txt.split('\n')){
    const m=line.match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
    if(m&&m[4].trim())out.push({time:+m[1]*60+ +m[2]+(m[3]?'.'+m[3]:0),t:m[4].trim()});
  }
  return out.sort((a,b)=>a.time-b.time);
}
function playNext(d){playSong((cur+d+songs.length)%songs.length);}
function togglePlay(){
  if(!audio.src){playSong(0);return;}
  playing?audio.pause():audio.play();
}
function menuAction(i){
  if(i===0){view=audio.src?'nowplaying':'menu';renderScreen();}
  else if(i===1){view='songs';songIdx=cur;renderScreen();}
  else if(i===2){view='nowplaying';renderScreen();}
  else if(i===3){playSong(Math.floor(Math.random()*songs.length));}
  else if(i===4){playNext(1);}
}

/* ═══ 轮盘：ryOS 角度逻辑（15° 步进 / 5° 拖动判定 / 8px 位移判定 / 四区点击） ═══ */
const ROTATION_STEP_DEG=15, DRAG_DETECT_DEG=5, DRAG_DETECT_DIST=8;
const wheel=$('wheel');
let lastAngle=null,rotAcc=0,isDragging=false;
function getCenter(){const r=wheel.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function angleRad(x,y){const c=getCenter();return Math.atan2(y-c.y,x-c.x);}
function angleDeg(x,y){const c=getCenter();return Math.atan2(y-c.y,x-c.x)*180/Math.PI;}
function wheelSection(deg){
  const a=deg*Math.PI/180;
  if(a>=-Math.PI/4&&a<Math.PI/4)return'right';
  if(a>=Math.PI/4&&a<(3*Math.PI)/4)return'bottom';
  if(a>=(3*Math.PI)/4||a<-(3*Math.PI)/4)return'left';
  return'top';
}
wheel.addEventListener('pointerdown',e=>{
  if(e.target.closest('.wheel-center'))return;
  e.preventDefault();
  const cx=e.clientX,cy=e.clientY;
  lastAngle=angleRad(cx,cy);
  const sx=cx,sy=cy;rotAcc=0;isDragging=false;
  const step=ROTATION_STEP_DEG*Math.PI/180, dragTh=DRAG_DETECT_DEG*Math.PI/180;
  function mv(ev){
    if(lastAngle===null)return;
    const a=angleRad(ev.clientX,ev.clientY);
    let d=a-lastAngle;
    if(d>Math.PI)d-=2*Math.PI;
    if(d<-Math.PI)d+=2*Math.PI;
    rotAcc+=d;lastAngle=a;
    if(!isDragging){
      const dist=Math.hypot(ev.clientX-sx,ev.clientY-sy);
      if(Math.abs(rotAcc)>dragTh||dist>DRAG_DETECT_DIST)isDragging=true;
    }
    while(rotAcc>step){onRotate('cw');rotAcc-=step;}
    while(rotAcc<-step){onRotate('ccw');rotAcc+=step;}
  }
  function up(ev){
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    if(!isDragging){onWheelClick(wheelSection(angleDeg(ev.clientX,ev.clientY)));}
    lastAngle=null;rotAcc=0;isDragging=false;
  }
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',up);
});
function onRotate(dir){
  const d=dir==='cw'?1:-1;
  if(view==='menu'){menuIdx=(menuIdx+d+5)%5;renderScreen();}
  else if(view==='songs'){songIdx=Math.max(0,Math.min(songs.length-1,songIdx+d));renderScreen();}
}
function onWheelClick(sec){
  if(sec==='top'){view='menu';menuIdx=0;renderScreen();}
  else if(sec==='bottom'){
    if(view==='nowplaying'){view='lyrics';renderScreen();}
    else if(view==='lyrics'){view='nowplaying';renderScreen();}
    else togglePlay();
  }
  else if(sec==='right'){playNext(1);}
  else if(sec==='left'){audio.currentTime>3?audio.currentTime=0:playNext(-1);}
}
$('centerBtn').addEventListener('click',()=>{
  if(view==='menu'){
    // 没在播放时，中心键直接播第一首
    if(!audio.src&&!playing){playSong(0);return;}
    menuAction(menuIdx);
  }
  else if(view==='songs')playSong(songIdx);
  else if(view==='nowplaying'){togglePlay();}
  else if(view==='lyrics'){view='nowplaying';renderScreen();}
});
wheel.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>8){onRotate(e.deltaY>0?'cw':'ccw');}
},{passive:true});

/* 键盘 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){playNext(1);}
  else if(e.key==='ArrowLeft'){audio.currentTime>3?audio.currentTime=0:playNext(-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();onRotate('ccw');}
  else if(e.key==='ArrowDown'){e.preventDefault();onRotate('cw');}
  else if(e.key==='Enter'){$('centerBtn').click();}
  else if(e.key==='Escape'){view='menu';renderScreen();}
});


/* ── 机身拖动：按住拖动。iframe 自己收 move/up（setPointerCapture 保证不丢事件），
   用 screenX 物理坐标算位移（不随 iframe 移动变化，无反馈环） ── */
(function bodyDrag(){
  const ipod=document.querySelector('.ipod');
  if(!ipod)return;
  let dragging=false,startSx=0,startSy=0;
  ipod.addEventListener('pointerdown',e=>{
    if(e.target.closest('.wheel')||e.target.closest('.menu-row')||e.target.closest('.np-track')||e.target.closest('.np-lrc'))return;
    dragging=true;startSx=e.screenX;startSy=e.screenY;
    try{ipod.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
    try{parent.postMessage({type:'ipod-drag-start'},'*');}catch(err){}
  });
  ipod.addEventListener('pointermove',e=>{
    if(!dragging)return;
    try{parent.postMessage({type:'ipod-drag-to',dsx:e.screenX-startSx,dsy:e.screenY-startSy},'*');}catch(err){}
  });
  function end(){if(!dragging)return;dragging=false;try{parent.postMessage({type:'ipod-drag-end'},'*');}catch(err){}}
  ipod.addEventListener('pointerup',end);
  ipod.addEventListener('pointercancel',end);
})();


window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='ipod-stop'){
    audio.pause();audio.currentTime=0;audio.src='';
    playing=false;view='menu';menuIdx=0;
    renderScreen();syncPlayState();
  }
});
init();
</script>
</body></html>
